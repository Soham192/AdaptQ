services:
  - type: web
    name: adaptq
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: GEMINI_API_KEY
        sync: false
      - key: JUGAADFLOW_AGENT_MODEL
        value: gemini-3.6-flash
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ALERT_PHONE_NUMBER
        sync: false
